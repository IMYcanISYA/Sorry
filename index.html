<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">

	<link rel="stylesheet" href="style.css">
	<link

	/>
	<title>Sorry</title>
</head>
<body>
	<div class="wrapper">

			<div class="swiper-slide">Надеюсь что впредь я буду делать меньше хуйни</div>
			<div class="swiper-slide">Люблю вас ♥</div>
		</div>
	</div>
	</div>
	<div class="main">
		<div class="rainbow">
			<img src="rainbow.png" alt="">
		</div>
		
		<img src="cloud.png" alt="" class="cloud _cloud1">
		<img src="cloud.png" alt="" class="cloud _cloud2">
		<img src="sun.png" alt="" class="sun _sun1">
		<img src="sun.png" alt="" class="sun _sun2">
		<div class="water">
			<span></span>
			<span></span>
		</div>
		<img src="heart.png" alt="" class="heart">
	</div>
	<script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
	<script src="script.js"></script>
